services:
  ffmpeg-service:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ffmpeg-service
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - JOBS_DIR=/tmp/jobs
      - NODE_ENV=production
    volumes:
      # Named volume for the jobs/working dir to avoid permission issues
      - jobs-data:/tmp/jobs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  jobs-data:
